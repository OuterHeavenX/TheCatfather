<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>The Catfather</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress, #status-stage {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #120b17;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice, #status-stage {
	display: none;
}

#status-stage {
	bottom: 5%;
	color: #b9a7c4;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.85rem;
	padding: 0 1rem;
	text-align: center;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-stage"></div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2600472,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
// NOTE: hand-patched after export. See "Web export" in README.md before
// regenerating this file — a plain re-export drops the boot fallbacks below.
let engine = null;

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusStage = document.getElementById('status-stage');

	// How long to wait before assuming the boot is wedged rather than slow.
	const DOWNLOAD_STALL_MS = 120000;
	const STARTUP_STALL_MS = 45000;
	// Safari can leave indexedDB.open() pending forever; don't wait on it.
	const IDB_PROBE_MS = 5000;

	let initializing = true;
	let statusMode = '';
	let stage = 'loading the engine';
	let storageState = 'not checked yet';
	let loaded = 0;
	let total = 0;
	let stallTimer = null;

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusStage.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function setStage(text) {
		statusStage.textContent = text;
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function mb(bytes) {
		return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
	}

	// The engine swallows errors thrown while instantiating the WASM module and
	// while mounting the IndexedDB-backed user:// filesystem: the promise it
	// returns simply never settles, leaving the splash up forever. Time it out
	// so a wedged boot says something instead of spinning.
	function armStallTimer(ms) {
		if (stallTimer !== null) {
			clearTimeout(stallTimer);
		}
		stallTimer = setTimeout(showStall, ms);
	}

	function showStall() {
		if (!initializing) {
			return;
		}
		setStatusNotice([
			'The Catfather could not finish loading.',
			'',
			'Close other browser tabs and reload — this is usually the browser',
			'running out of memory for the 40 MB engine.',
			'',
			'Stuck while: ' + stage,
			'Downloaded: ' + mb(loaded) + ' of ' + (total > 0 ? mb(total) : 'unknown'),
			'Saved games: ' + storageState,
		].join('\n'));
		setStatusMode('notice');
	}

	// Resolves true only if IndexedDB actually answers. A hang counts as a
	// failure, which is the whole point: Godot's own mount has no timeout.
	function probeStorage() {
		return new Promise((resolve) => {
			let settled = false;
			function finish(ok, why) {
				if (settled) {
					return;
				}
				settled = true;
				storageState = ok ? 'available' : 'unavailable (' + why + ')';
				resolve(ok);
			}
			const timer = setTimeout(() => finish(false, 'timed out'), IDB_PROBE_MS);
			let request = null;
			try {
				request = indexedDB.open('the-catfather-storage-probe', 1);
			} catch (err) {
				clearTimeout(timer);
				finish(false, 'blocked');
				return;
			}
			request.onsuccess = () => {
				clearTimeout(timer);
				try {
					request.result.close();
				} catch (err) {
					// Closing is best-effort; the probe already succeeded.
				}
				finish(true, 'ok');
			};
			request.onerror = () => {
				clearTimeout(timer);
				finish(false, 'refused');
			};
			request.onblocked = () => {
				clearTimeout(timer);
				finish(false, 'blocked');
			};
		});
	}

	function startEngine() {
		engine = new Engine(GODOT_CONFIG);
		setStatusMode('progress');
		setStage('Downloading…');
		stage = 'downloading the game';
		armStallTimer(DOWNLOAD_STALL_MS);

		engine.startGame({
			'onProgress': function (current, total_) {
				if (current > 0 && total_ > 0) {
					loaded = current;
					total = total_;
					statusProgress.value = current;
					statusProgress.max = total_;
					const pct = Math.floor((current / total_) * 100);
					if (current >= total_) {
						// Bytes are in; everything after this is WASM
						// instantiation and filesystem setup.
						stage = 'starting the engine';
						setStage('Starting…');
						armStallTimer(STARTUP_STALL_MS);
					} else {
						setStage('Downloading… ' + pct + '%');
					}
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			if (stallTimer !== null) {
				clearTimeout(stallTimer);
			}
			setStatusMode('hidden');
		}, displayFailureNotice);
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			engine = new Engine(GODOT_CONFIG);
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		setStage('Checking storage…');
		probeStorage().then((ok) => {
			if (!ok) {
				// Mounting user:// would hang here. Run without it: progress
				// is lost between sessions, but the game boots.
				console.warn('IndexedDB unavailable, running without persistent saves:', storageState);
				GODOT_CONFIG['persistentPaths'] = [];
			}
			startEngine();
		});
	}
}());
		</script>
	</body>
</html>
